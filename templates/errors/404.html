{% extends "base.html" %}
{% block title %}Page not found — {{ app_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="empty-state">
      <p class="eyebrow">Error 404</p>
      <h1>Page not found</h1>
      <p>The book or page you requested does not exist, or it has not been published.</p>
      <a class="btn btn-primary" href="{{ url_for('public.catalogue') }}">Browse the catalogue</a>
    </div>
  </div>
</section>
{% endblock %}
